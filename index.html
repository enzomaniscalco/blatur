<title>Blåtur-appen</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#0f3b2e;      /* flaskegrønn bakgrunn */
    --green-2:#144a3a;
    --paper:#f3e9d2;      /* ølbrikke-papir */
    --paper-2:#e6d9bb;
    --ink:#1b1a17;
    --red:#b3202b;        /* Astra-rød */
    --gold:#d9a441;
    --muted:#6f6a5c;
    --ok:#2e7d4f;
    --radius:6px;
    --font-d:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
    --font-b:"Barlow","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--green);color:var(--paper);font-family:var(--font-b);font-size:16px;line-height:1.45}
  button{font:inherit;cursor:pointer}
  input,textarea{font:inherit}

  .app{max-width:520px;margin:0 auto;padding:0 0 90px}

  header{padding:22px 18px 10px}
  header h1{font-family:var(--font-d);font-weight:800;font-size:44px;line-height:.92;margin:0;letter-spacing:.5px;text-transform:uppercase}
  header h1 span{display:block;color:var(--gold);font-size:22px;font-weight:700;letter-spacing:1px;margin-top:6px}

  nav.tabs{display:flex;gap:6px;padding:6px 14px 14px;position:sticky;top:0;background:var(--green);z-index:5}
  nav.tabs button{flex:1;background:transparent;border:2px solid rgba(243,233,210,.35);color:var(--paper);border-radius:var(--radius);padding:8px 0;font-family:var(--font-d);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--green);border-color:var(--paper)}
  nav.tabs button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  section.pane{display:none;padding:0 14px}
  section.pane.active{display:block}

  /* Dag-faner */
  .day-intro{color:rgba(243,233,210,.75);margin:4px 2px 14px;font-size:15px}
  .stop{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-top:1px solid rgba(243,233,210,.18)}
  .stop:last-child{border-bottom:1px solid rgba(243,233,210,.18)}
  .stop .t{font-family:var(--font-d);font-size:24px;font-weight:700;color:var(--gold);line-height:1;padding-top:2px}
  .stop .n{font-family:var(--font-d);font-size:22px;font-weight:700;line-height:1.05}
  .stop .a{font-size:13px;color:rgba(243,233,210,.65);margin-top:2px}
  .stop .w{font-size:14.5px;margin-top:6px;color:rgba(243,233,210,.9)}
  .stop .mv{display:inline-block;margin-top:6px;font-size:12.5px;padding:2px 8px;border-radius:99px;background:rgba(217,164,65,.18);color:var(--gold)}
  .stop .del{background:none;border:0;color:rgba(243,233,210,.5);font-size:13px;padding:0;margin-top:6px;text-decoration:underline}

  .empty{border:2px dashed rgba(243,233,210,.35);border-radius:var(--radius);padding:22px 16px;text-align:center;color:rgba(243,233,210,.8);margin:6px 0 14px}
  .empty strong{display:block;font-family:var(--font-d);font-size:26px;font-weight:700;color:var(--paper);margin-bottom:4px}

  details.add{margin-top:14px}
  details.add summary{cursor:pointer;font-family:var(--font-d);font-size:20px;font-weight:700;color:var(--gold);list-style:none}
  details.add summary::-webkit-details-marker{display:none}
  .form{display:grid;gap:8px;margin-top:10px}
  .form input,.form textarea{width:100%;border:0;border-radius:var(--radius);padding:10px 12px;background:var(--paper);color:var(--ink)}
  .form .row{display:grid;grid-template-columns:90px 1fr;gap:8px}
  .btn{background:var(--red);color:#fff;border:0;border-radius:var(--radius);padding:11px 16px;font-family:var(--font-d);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .btn.ghost{background:transparent;border:2px solid rgba(243,233,210,.4);color:var(--paper)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  .note{background:rgba(0,0,0,.18);border-radius:var(--radius);padding:12px 14px;font-size:14px;margin:14px 0}
  .note b{color:var(--gold)}

  /* Oppdrag */
  .who{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 16px}
  .who button{background:var(--paper);color:var(--green);border:0;border-radius:var(--radius);padding:14px 8px;font-family:var(--font-d);font-size:24px;font-weight:700}
  .who button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
  .spec-label{font-size:13px;color:rgba(243,233,210,.6);margin:-6px 2px 6px}
  .who.spec{grid-template-columns:1fr 1fr 1fr;margin-top:0}
  .who.spec button{background:transparent;border:2px solid rgba(243,233,210,.35);color:var(--paper);font-size:18px;padding:10px 4px}
  span.chk{cursor:default}

  /* Lagfarger: HSV blå/hvit, St. Pauli brun/hvit – lys tekst på mørk flate for lesbarhet */
  :root{ --hsv:#0b3f96; --hsv-2:#082e6e; --pauli:#5a3a1e; --pauli-2:#3f2812; }
  .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px;margin:6px 0 14px}
  .score .team{text-align:center;border-radius:var(--radius);padding:12px 8px 10px;color:#fff;border:2px solid transparent;position:relative}
  .score .team.a{background:linear-gradient(180deg,var(--hsv),var(--hsv-2))}
  .score .team.b{background:linear-gradient(180deg,var(--pauli),var(--pauli-2))}
  .score .team .nm{font-family:var(--font-d);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#fff}
  .score .team .pt{font-family:var(--font-d);font-size:56px;font-weight:800;line-height:.9;margin:2px 0;color:#fff}
  .score .team .mem{font-size:12.5px;color:rgba(255,255,255,.8);line-height:1.5}
  .score .team .mem span{white-space:nowrap}
  .score .team .mem b{color:#fff}
  .score .team .mem .low b{color:var(--gold)}
  .score .team .pen{font-size:12px;color:#ffd0d0;font-weight:600;margin-top:2px}
  .score .vs{font-family:var(--font-d);font-size:20px;font-weight:700;color:var(--gold);padding:0 2px;align-self:center}
  .score .team.lead{border-color:var(--gold)}
  .score .team.lead .nm::after{content:" ●";color:var(--gold)}
  .badge{display:inline-block;padding:1px 8px;border-radius:999px;font-weight:700;color:#fff;font-size:13px;vertical-align:1px}
  .badge.a{background:var(--hsv)} .badge.b{background:var(--pauli)}

  .mine{font-size:14px;color:rgba(243,233,210,.75);margin:0 2px 10px}
  .mine b{color:var(--gold)}

  .mgroup{margin:18px 0 6px;font-family:var(--font-d);font-size:22px;font-weight:700;color:var(--gold);letter-spacing:.5px}
  .m{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-top:1px solid rgba(243,233,210,.18)}
  .m .chk{width:28px;height:28px;border:2px solid var(--paper);border-radius:4px;background:transparent;color:var(--green);font-weight:800;font-size:18px;display:grid;place-items:center;margin-top:1px}
  .m.done .chk{background:var(--gold);border-color:var(--gold)}
  .m .txt{font-size:15px}
  .m.done .txt{color:rgba(243,233,210,.55);text-decoration:line-through}
  .m .pts{font-family:var(--font-d);font-size:22px;font-weight:700;color:var(--gold);white-space:nowrap}
  .m .by{font-size:12px;color:rgba(243,233,210,.55);margin-top:3px}
  .m .chk:disabled{opacity:.35;cursor:not-allowed}
  .opts{display:grid;gap:6px;margin-top:8px}
  .opt{text-align:left;background:rgba(243,233,210,.08);border:2px solid rgba(243,233,210,.3);color:var(--paper);border-radius:var(--radius);padding:8px 10px;font-size:14px}
  .opt:disabled{cursor:default;opacity:.55}
  .opt.right{border-color:var(--gold);background:rgba(217,164,65,.22);opacity:1}
  .opt.wrong{border-color:var(--red);background:rgba(179,32,43,.25);opacity:1}
  .m.lost .txt{color:rgba(243,233,210,.55)}
  .m.lost .chk{opacity:.6}
  .m.miss .chk{border-color:var(--red);color:var(--red)}
  .m.miss .txt{color:rgba(243,233,210,.55)}
  .gdone{font-size:13.5px;color:rgba(243,233,210,.6);margin:14px 0 0;padding:6px 0;border-top:1px solid rgba(243,233,210,.18)}
  details.gcol{margin:14px 0 0;border-top:1px solid rgba(243,233,210,.18);padding-top:6px}
  details.gcol>summary{cursor:pointer;list-style:none;font-size:14px;color:rgba(243,233,210,.75);padding:6px 0}
  details.gcol>summary::-webkit-details-marker{display:none}
  details.gcol>summary .hint{float:right;font-size:12.5px;color:var(--gold)}
  details.gcol[open]>summary .hint{opacity:.5}
  .gate .notme{margin-top:22px;font-size:13.5px;color:rgba(243,233,210,.6)}
  .gate .notme a{color:var(--gold);text-decoration:underline}
  .msub{font-family:var(--font-d);font-size:17px;font-weight:700;color:rgba(243,233,210,.85);margin:12px 0 2px;letter-spacing:.3px}
  .gnote{font-size:13.5px;color:rgba(243,233,210,.7);margin:-4px 0 8px}
  details.ans{margin-top:4px;font-size:13.5px}
  details.ans summary{cursor:pointer;color:var(--gold);list-style:none;text-decoration:underline dotted}
  details.ans summary::-webkit-details-marker{display:none}
  details.ans[open] summary{margin-bottom:2px}

  .ff{background:rgba(179,32,43,.16);border:2px solid rgba(179,32,43,.55);border-radius:var(--radius);padding:12px 14px;margin:0 0 14px}

// Felles lagring: et Google-regneark bak et Apps Script-webapp (se oppsett). Personlig lagring: localStorage.
const API = "https://script.google.com/macros/s/AKfycbxzL5oUHbBL2Rdai1OQNNhz1REw9TLKCCTipLDXY9PBZZE3WYHvMXLmkFnDXTRsWjmS/exec";
let cache = {};                          // siste kjente felles verdier, key -> JSON-streng
let online = true, lastSync = 0;
async function syncAll(force){
  if (!API) return false;
  if (!force && Date.now() - lastSync < 1500) return true;   // nettopp hentet – ikke hent igjen
  try{
    const r = await fetch(API + '?t=' + Date.now(), {cache:'no-store'});
    const j = await r.json();
    if (j && j.items){ cache = j.items; online = true; lastSync = Date.now(); saveSnapshot(); return true; }
  }catch(e){ console.error("sync", e); }
  online = false; return false;
}
// Siste kjente felles data lagres lokalt, så appen kan vises med en gang neste gang (og oppdateres i bakgrunnen).
const KEY_SNAP = 'hh26:snapshot';
function saveSnapshot(){ try{ localStorage.setItem(KEY_SNAP, JSON.stringify(cache)); }catch(e){} }
function loadSnapshot(){ try{ const v = localStorage.getItem(KEY_SNAP); if (v){ cache = JSON.parse(v) || {}; return Object.keys(cache).length > 0; } }catch(e){} return false; }
async function sget(key, shared){
  if (!shared){ try{ const v = localStorage.getItem(key); return v === null ? null : JSON.parse(v); }catch(e){ return null; } }
  if (!(key in cache)) return null;
  try{ return JSON.parse(cache[key]); }catch(e){ return null; }
}
async function sset(key, val, shared){
  if (!shared){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }
  if (typeof me !== 'undefined' && SPECTATORS.includes(me)) return false; // tilskuere skriver aldri til felles lagring
  if (!API) return false;
  try{
    const r = await fetch(API, {method:'POST', body: JSON.stringify({key, value: val})}); // text/plain → ingen preflight
    const j = await r.json();
    if (!j || !j.ok) return false;
    cache[key] = JSON.stringify(val); online = true; saveSnapshot(); return true;
  }catch(e){ console.error("save", e); online = false; return false; }
}

function sortKey(t){ // 05:00 counts as after midnight
  const m = /^(\d{1,2}):?(\d{2})?/.exec(t||""); if(!m) return 9999;
  let h = +m[1], mi = +(m[2]||0); if (h < 10) h += 24; return h*60+mi;
}
function esc(s){ return String(s||"").replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function teamOf(p){ if(!teams) return null; return teams.A.includes(p) ? 'A' : (teams.B.includes(p) ? 'B' : null); }
const FF_PENALTY = 5;
const FF_VOTERS_NEEDED = 3;                    // flertall blant de fem som kan stemme
function ffStatus(e){                          // 'ok' | 'pending' | 'dismissed'
  if (!e.d) return 'ok';
  const v = Object.values(e.v || {});
  const g = v.filter(x => x === 'g').length, f = v.filter(x => x === 'f').length;
  if (g >= FF_VOTERS_NEEDED) return 'ok';
  if (f >= FF_VOTERS_NEEDED) return 'dismissed';
  if (g + f >= PEOPLE.length - 1) return g > f ? 'ok' : 'dismissed';   // alle har stemt – flertall, uavgjort frikjenner
  return 'pending';
}
function ffCount(p){ return ff.filter(e => e.who === p && ffStatus(e) === 'ok').length; }
function ffPenalty(team){ return teams[team].reduce((a,p) => a + ffCount(p)*FF_PENALTY, 0); }
function points(team){
  let s = 0;
  for (const m of activeMissions()){
    if (m.once){ if (teams[team].some(p => done[p] && done[p][m.id] === true)) s += m.p; continue; }
    for (const p of teams[team]) if (done[p] && done[p][m.id] === true) s += m.p;
  }
  return s - ffPenalty(team);
}
function personPts(p){
  let s = 0;
  for (const m of activeMissions()) if (done[p] && done[p][m.id] === true) s += m.p;
  return s - ffCount(p)*FF_PENALTY;
}
function memLine(names){ const low = lowestOf(names); return names.map(p => `<span class="${low.includes(p)?'low':''}">${esc(p)} <b>${personPts(p)}</b></span>`).join(' · '); }
function lowestOf(names){ const pts = names.map(p => [p, personPts(p)]); const min = Math.min(...pts.map(x=>x[1])); return pts.filter(x=>x[1]===min).map(x=>x[0]); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

      <div class="team b ${pb>pa?'lead':''}"><div class="nm">${TEAMS.B}</div><div class="pt">${pb}</div><div class="mem">${memLine(teams.B)}</div>${ffPenalty('B')?`<div class="pen">−${ffPenalty('B')} Fahnenflucht</div>`:''}</div>

    <div class="note"><b>Regler:</b> hvert oppdrag kan krysses av <b>én gang per person</b>. <b>Motstanderlaget må ha sett det.</b> Oppgjør <b>kl. 22:00</b> hver dag, og neste runde starter umiddelbart – kvelden etter kl. 22 teller for neste dag.<br><b>Premie:</b> en flaske <b>champagne</b>. <b>Den på taperlaget med færrest poeng</b> (gult tall over) prøver å bestille den – uansett hvor vi er. Selger de ikke champagne, blir det en <b>vanlig runde</b>. <b>Taperlaget betaler samlet.</b> Hver <b>Fahnenflucht</b> koster laget <b>${FF_PENALTY} poeng</b>.</div>`;
  let g = '', sg = '';
  const answerers = PEOPLE.filter(p => !QUIZ_MAKERS.includes(p));
  const groupDone = grp => activeMissions().filter(m => m.g === grp && m.o).every(m => answerers.every(p => done[p] && done[p][m.id] !== undefined));
  // Quiz/gjetting jeg selv er ferdig med kollapses til én linje (kan åpnes for å se fasit)
  const myDone = grp => !spec && answerers.includes(me) && activeMissions().filter(m => m.g === grp && m.o).every(m => done[me] && done[me][m.id] !== undefined);
  const myPts = grp => activeMissions().filter(m => m.g === grp && m.o && done[me] && done[me][m.id] === true).reduce((s,m)=>s+m.p,0);
  let openDetails = false;
  for (const m of activeMissions()){

    html += rowFor(m, spec);
  }
  if (openDetails) html += `</details>`;
  html += footerFor(spec);
  oppRoot.innerHTML = html;
  bind();
}
function claimers(m){ return PEOPLE.filter(p => done[p] && done[p][m.id] === true); }
function rowFor(m, spec){
    if (m.once && !spec){
      const cl = claimers(m);
      const myTeam = teamOf(me);
      const iClaimed = cl.includes(me);
      const other = cl.find(p => teamOf(p) && teamOf(p) !== myTeam);
      const mate = cl.find(p => p !== me && teamOf(p) === myTeam);
      const locked = !!other || (!!mate && !iClaimed);
      const note = other ? `Registrert av ${TEAMS[teamOf(other)]} (${other}) – bare ${other} kan fjerne den`
                 : mate ? `Registrert av ${mate} for ${TEAMS[myTeam]}` : '';
      const teamDone = iClaimed || !!mate;
      return `<div class="m ${teamDone?'done':''} ${other?'lost':''}">
        <button class="chk" data-m="${m.id}" ${locked?'disabled':''} aria-pressed="${iClaimed}" aria-label="${iClaimed?'Fjern':'Kryss av'}: ${esc(m.t)}">${cl.length?'✓':''}</button>
        <div><div class="txt">${esc(m.t)}</div>${note?`<div class="by">${note}</div>`:''}</div>
        <div class="pts">${m.p}</div>
      </div>`;
    }
    if (spec){
      const who = PEOPLE.filter(p => done[p] && done[p][m.id]);
      return `<div class="m ${who.length?'done':''}">
        <span class="chk" aria-hidden="true">${who.length?'✓':''}</span>
        <div><div class="txt">${esc(m.t)}</div>${who.length?`<div class="by">Gjort av ${who.join(', ')}</div>`:''}</div>
        <div class="pts">${m.p}</div>

async function reportFF(who){
  if (isSpec() || !me) return;
  const now = Date.now();
  const t = new Date(now).toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'});
  const entry = {id: now + '-' + who, who, by: me, t, ts: now};
  const localDup = ff.find(e => e.who === who && e.ts && now - e.ts < 2*60*1000);
  if (localDup){ toast(`${who} er allerede meldt av ${localDup.by} kl. ${localDup.t} – samme rop teller én gang.`); renderOpp(); return; }
  ff = [...ff, entry]; renderOpp();                                  // vis med en gang
  await syncAll(true);
  const cur = await sget(KEY_FF(), true) || [];
  const dup = cur.find(e => e.who === who && e.ts && now - e.ts < 2*60*1000 && e.id !== entry.id);
  if (dup){ ff = cur; renderOpp(); toast(`${who} var allerede meldt av ${dup.by} kl. ${dup.t} – samme rop teller én gang.`); return; }
  cur.push(entry);

  if(!ok){ ff = ff.filter(e => e.id !== entry.id); renderOpp(); toast("Fikk ikke lagret – prøv igjen."); return; }
  ff = cur; renderOpp();
}
