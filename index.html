<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blåtur">
<title>Blåtur-appen</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#0f3b2e;      /* flaskegrønn bakgrunn */
    --green-2:#144a3a;
    --paper:#f3e9d2;      /* ølbrikke-papir */
    --paper-2:#e6d9bb;
    --ink:#1b1a17;
    --red:#b3202b;        /* Astra-rød */
    --gold:#d9a441;
    --muted:#6f6a5c;
    --ok:#2e7d4f;
    --radius:6px;
    --font-d:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
    --font-b:"Barlow","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--green);color:var(--paper);font-family:var(--font-b);font-size:16px;line-height:1.45}
  button{font:inherit;cursor:pointer}
  input,textarea{font:inherit}

  .app{max-width:520px;margin:0 auto;padding:0 0 90px}

  header{padding:22px 18px 10px}
  header h1{font-family:var(--font-d);font-weight:800;font-size:44px;line-height:.92;margin:0;letter-spacing:.5px;text-transform:uppercase}
  header h1 span{display:block;color:var(--gold);font-size:22px;font-weight:700;letter-spacing:1px;margin-top:6px}

  nav.tabs{display:flex;gap:6px;padding:6px 14px 14px;position:sticky;top:0;background:var(--green);z-index:5}
  nav.tabs button{flex:1;background:transparent;border:2px solid rgba(243,233,210,.35);color:var(--paper);border-radius:var(--radius);padding:8px 0;font-family:var(--font-d);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--green);border-color:var(--paper)}
  nav.tabs button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  section.pane{display:none;padding:0 14px}
  section.pane.active{display:block}

  /* Dag-faner */
  .day-intro{color:rgba(243,233,210,.75);margin:4px 2px 14px;font-size:15px}
  .stop{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-top:1px solid rgba(243,233,210,.18)}
  .stop:last-child{border-bottom:1px solid rgba(243,233,210,.18)}
  .stop .t{font-family:var(--font-d);font-size:24px;font-weight:700;color:var(--gold);line-height:1;padding-top:2px}
  .stop .n{font-family:var(--font-d);font-size:22px;font-weight:700;line-height:1.05}
  .stop .a{font-size:13px;color:rgba(243,233,210,.65);margin-top:2px}
  .stop .w{font-size:14.5px;margin-top:6px;color:rgba(243,233,210,.9)}
  .stop .mv{display:inline-block;margin-top:6px;font-size:12.5px;padding:2px 8px;border-radius:99px;background:rgba(217,164,65,.18);color:var(--gold)}
  .stop .del{background:none;border:0;color:rgba(243,233,210,.5);font-size:13px;padding:0;margin-top:6px;text-decoration:underline}

  .empty{border:2px dashed rgba(243,233,210,.35);border-radius:var(--radius);padding:22px 16px;text-align:center;color:rgba(243,233,210,.8);margin:6px 0 14px}
  .empty strong{display:block;font-family:var(--font-d);font-size:26px;font-weight:700;color:var(--paper);margin-bottom:4px}

  details.add{margin-top:14px}
  details.add summary{cursor:pointer;font-family:var(--font-d);font-size:20px;font-weight:700;color:var(--gold);list-style:none}
  details.add summary::-webkit-details-marker{display:none}
  .form{display:grid;gap:8px;margin-top:10px}
  .form input,.form textarea{width:100%;border:0;border-radius:var(--radius);padding:10px 12px;background:var(--paper);color:var(--ink)}
  .form .row{display:grid;grid-template-columns:90px 1fr;gap:8px}
  .btn{background:var(--red);color:#fff;border:0;border-radius:var(--radius);padding:11px 16px;font-family:var(--font-d);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .btn.ghost{background:transparent;border:2px solid rgba(243,233,210,.4);color:var(--paper)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  .note{background:rgba(0,0,0,.18);border-radius:var(--radius);padding:12px 14px;font-size:14px;margin:14px 0}
  .note b{color:var(--gold)}

  /* Oppdrag */
  .who{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 16px}
  .who button{background:var(--paper);color:var(--green);border:0;border-radius:var(--radius);padding:14px 8px;font-family:var(--font-d);font-size:24px;font-weight:700}
  .who button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
  .spec-label{font-size:13px;color:rgba(243,233,210,.6);margin:-6px 2px 6px}
  .who.spec{grid-template-columns:1fr 1fr 1fr;margin-top:0}
  .who.spec button{background:transparent;border:2px solid rgba(243,233,210,.35);color:var(--paper);font-size:18px;padding:10px 4px}
  span.chk{cursor:default}

  .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:14px 10px;margin:6px 0 14px}
  .score .team{text-align:center}
  .score .team .nm{font-family:var(--font-d);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
  .score .team .pt{font-family:var(--font-d);font-size:56px;font-weight:800;line-height:.9;margin:2px 0}
  .score .team .mem{font-size:12.5px;color:var(--muted);line-height:1.3}
  .score .team .pen{font-size:12px;color:var(--red);font-weight:600;margin-top:2px}
  .score .vs{font-family:var(--font-d);font-size:20px;font-weight:700;color:var(--red);padding:0 6px}
  .score .team.a .pt{color:#0a3d91}
  .score .team.b .pt{color:#5a3a1e}
  .score .team.lead .nm::after{content:" ●";color:var(--gold)}

  .mine{font-size:14px;color:rgba(243,233,210,.75);margin:0 2px 10px}
  .mine b{color:var(--gold)}

  .mgroup{margin:18px 0 6px;font-family:var(--font-d);font-size:22px;font-weight:700;color:var(--gold);letter-spacing:.5px}
  .m{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-top:1px solid rgba(243,233,210,.18)}
  .m .chk{width:28px;height:28px;border:2px solid var(--paper);border-radius:4px;background:transparent;color:var(--green);font-weight:800;font-size:18px;display:grid;place-items:center;margin-top:1px}
  .m.done .chk{background:var(--gold);border-color:var(--gold)}
  .m .txt{font-size:15px}
  .m.done .txt{color:rgba(243,233,210,.55);text-decoration:line-through}
  .m .pts{font-family:var(--font-d);font-size:22px;font-weight:700;color:var(--gold);white-space:nowrap}
  .m .by{font-size:12px;color:rgba(243,233,210,.55);margin-top:3px}
  .m .chk:disabled{opacity:.35;cursor:not-allowed}
  .opts{display:grid;gap:6px;margin-top:8px}
  .opt{text-align:left;background:rgba(243,233,210,.08);border:2px solid rgba(243,233,210,.3);color:var(--paper);border-radius:var(--radius);padding:8px 10px;font-size:14px}
  .opt:disabled{cursor:default;opacity:.55}
  .opt.right{border-color:var(--gold);background:rgba(217,164,65,.22);opacity:1}
  .opt.wrong{border-color:var(--red);background:rgba(179,32,43,.25);opacity:1}
  .m.lost .txt{color:rgba(243,233,210,.55)}
  .m.lost .chk{opacity:.6}
  .m.miss .chk{border-color:var(--red);color:var(--red)}
  .m.miss .txt{color:rgba(243,233,210,.55)}
  .gdone{font-size:13.5px;color:rgba(243,233,210,.6);margin:14px 0 0;padding:6px 0;border-top:1px solid rgba(243,233,210,.18)}
  .msub{font-family:var(--font-d);font-size:17px;font-weight:700;color:rgba(243,233,210,.85);margin:12px 0 2px;letter-spacing:.3px}
  .gnote{font-size:13.5px;color:rgba(243,233,210,.7);margin:-4px 0 8px}
  details.ans{margin-top:4px;font-size:13.5px}
  details.ans summary{cursor:pointer;color:var(--gold);list-style:none;text-decoration:underline dotted}
  details.ans summary::-webkit-details-marker{display:none}
  details.ans[open] summary{margin-bottom:2px}

  .ff{background:rgba(179,32,43,.16);border:2px solid rgba(179,32,43,.55);border-radius:var(--radius);padding:12px 14px;margin:0 0 14px}
  .ffhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .fftitle{font-family:var(--font-d);font-size:26px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#f0a3a8}
  .ff .btn{padding:7px 14px 7px 10px;font-size:18px;display:inline-flex;align-items:center;gap:6px}
  .ffstar{width:18px;height:18px;fill:currentColor}
  .ffsay{font-size:12px;color:rgba(243,233,210,.6);line-height:1.2;margin-top:2px}
  .ffhead{align-items:flex-start}
  .ffrule{font-size:13.5px;color:rgba(243,233,210,.8);margin:6px 0 10px}
  .fftally{display:flex;flex-wrap:wrap;gap:6px}
  .fftag{background:var(--paper);color:var(--ink);border-radius:99px;padding:3px 10px;font-size:14px}
  .fftag b{color:var(--red)}
  .ffnone{font-size:13.5px;color:rgba(243,233,210,.6)}
  .fflog{margin-top:8px;border-top:1px solid rgba(243,233,210,.18);padding-top:6px}
  .ffrow{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
  .ffby{color:rgba(243,233,210,.55)}
  .ffrow{flex-wrap:wrap}
  .ffrow.dis > span:first-child{text-decoration:line-through;opacity:.6}
  .ffx{width:100%;margin-top:3px;font-size:12.5px;color:rgba(243,233,210,.8)}
  .ffvote.out{color:rgba(243,233,210,.55)}
  .nein{background:var(--paper);color:var(--red);border:0;border-radius:var(--radius);padding:3px 10px;font-family:var(--font-d);font-weight:800;font-size:15px}
  .vote{border:0;border-radius:99px;padding:3px 9px;font-size:12.5px;font-weight:600;margin-left:4px}
  .vote.g{background:var(--red);color:#fff}
  .vote.f{background:var(--paper);color:var(--green)}
  .ffpick{margin:10px 0 0}
  .ffpick button{font-size:20px;padding:10px 6px}
  .gate{position:fixed;inset:0;z-index:50;background:var(--green);overflow:auto;padding:28px 18px 40px}
  .gate[hidden]{display:none}
  .gate h2{font-family:var(--font-d);font-weight:800;font-size:40px;line-height:.95;text-transform:uppercase;margin:0 0 6px}
  .gate p{color:rgba(243,233,210,.75);margin:0 0 18px;font-size:15px}
  .gate .who{margin-bottom:12px}
  .gate .pin{display:flex;gap:8px;max-width:320px}
  .gate .pin .btn{white-space:nowrap}
  .gate .pin input{flex:1;min-width:0;border:0;border-radius:var(--radius);padding:14px 12px;font-size:22px;letter-spacing:4px;background:var(--paper);color:var(--ink);text-align:center}
  .pinmsg{color:#f0a3a8;min-height:1.4em}
  .gate .guess{display:grid;gap:8px}
  .gate .guess button{background:var(--paper);color:var(--green);border:0;border-radius:var(--radius);padding:16px 12px;font-family:var(--font-d);font-size:26px;font-weight:700;text-align:left}
  .gate .guess button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .remind{background:var(--gold);color:var(--ink);border-radius:var(--radius);padding:10px 12px;margin:0 0 10px;font-weight:600;font-size:14.5px}
  .round{display:flex;justify-content:space-between;align-items:center;background:rgba(217,164,65,.14);border:1px solid rgba(217,164,65,.5);border-radius:var(--radius);padding:8px 12px;margin:0 0 12px;font-size:14px}
  .round b{color:var(--gold)}
  .round .per{font-size:12px;color:rgba(243,233,210,.65)}
  .round .dl{font-family:var(--font-d);font-size:18px;font-weight:700;color:var(--gold)}
  .results{margin:0 0 12px}
  .resrow{font-size:14px;padding:8px 0;border-top:1px solid rgba(243,233,210,.18)}
  .resrow:last-child{border-bottom:1px solid rgba(243,233,210,.18)}
  .resday{display:inline-block;min-width:66px;font-family:var(--font-d);font-size:18px;font-weight:700;color:var(--gold)}
  .resline{font-size:13px;color:rgba(243,233,210,.7);margin-top:2px}
  .resline b{color:var(--paper)}
  .ann{background:var(--red);color:#fff;display:flex;flex-direction:column;justify-content:center;text-align:center;z-index:60}
  .ann[hidden]{display:none}
  .ann .kick{font-family:var(--font-d);font-size:20px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.85}
  .ann h2{font-size:54px;margin:6px 0 4px;color:#fff}
  .ann .sc{font-family:var(--font-d);font-size:40px;font-weight:800;margin:6px 0 18px}
  .ann p{color:#fff;font-size:17px;margin:0 auto 12px;max-width:34ch}
  .ann p b{color:var(--gold)}
  .ann .nx{font-size:14px;opacity:.85;margin-top:6px}
  .ann .btn{background:var(--paper);color:var(--red);margin:22px auto 0;padding:14px 28px;font-size:22px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  .status{font-size:12.5px;color:rgba(243,233,210,.55);margin:8px 2px 0}
  .sr{position:absolute;left:-9999px}
  @media (prefers-reduced-motion:no-preference){
    .m .chk{transition:background .15s}
  }
</style>
</head>
<body>
<div id="gate" class="gate" hidden></div>
<div id="ann" class="gate ann" hidden></div>
<div class="app">
  <header>
    <h1>Blåtur-appen<span>24.–27. september · Nagels Allee 8, 22769 Hamburg</span></h1>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="false" data-tab="tor">Tor</button>
    <button role="tab" aria-selected="false" data-tab="fre">Fre</button>
    <button role="tab" aria-selected="true" data-tab="lor">Lør</button>
    <button role="tab" aria-selected="false" data-tab="son">Søn</button>
    <button role="tab" aria-selected="false" data-tab="opp">Oppdrag</button>
  </nav>

  <section class="pane" id="pane-tor" data-day="tor"></section>
  <section class="pane" id="pane-fre" data-day="fre"></section>
  <section class="pane active" id="pane-lor" data-day="lor"></section>
  <section class="pane" id="pane-son" data-day="son"></section>

  <section class="pane" id="pane-opp">
    <div id="opp-root"></div>
  </section>
</div>

<script>
/* ---------- Data ---------- */
const PEOPLE = ["Enzo","Andreas","Carl","Christoffer","Simon","Steinn"];
const SPECTATORS = ["Vetle","Jan Christian","Johan"]; // ser alt, kan ikke røre noe
const isSpec = () => SPECTATORS.includes(me);
const QUIZ_MAKERS = ["Enzo","Andreas"]; // laget quizen – kan ikke svare
const UNLOCK_PIN = "4262874";              // deles ut av arrangørene når destinasjonen avsløres
const KEY_UNLOCK = "hh26:unlocked";     // personlig
const TEAMS = { A:"HSV", B:"St. Pauli" };

const FIXED_DAYS = {
  tor: { intro:"Torsdag 24. – resten av planen kommer fra ansvarlig. Legg til stopp under når den er klar.", stops:[
      {t:"13:15",n:"Avreise Gardermoen",a:"DY1126",w:"",mv:""},
      {t:"14:40",n:"Ankomst Hamburg",a:"",w:"",mv:""},
      {t:"14:50",n:"Ta ut kontanter på flyplassen",a:"Bankautomat i ankomsthallen – Haspa, Sparkasse eller Volksbank. Unngå Euronet (gule/blå).",w:"Ta ut 200 € hver. Dekker det som må betales kontant: barene i Schanze torsdag, Holsten-Schwemme, Kixx, Silbersack og Hamburger Berg lørdag, samt reserve til Otto's, Dum99 og Ashirwad. Casino-innsats kommer i tillegg – ta ut det du selv vil spille for. Velg «belast i EUR» hvis automaten tilbyr NOK.",mv:""},
      {t:"15:00",n:"S-Bahn til leiligheten",a:"S1 fra Airport → Altona",w:"Ca. 35 min. NB: toget deles i Ohlsdorf – sitt i den delen som kommer fra flyplassen (alle vogner fra Airport går riktig vei). Fra Altona: 12 min gange til Nagels Allee, eller S21/S31 ett stopp til Holstenstraße (3 min gange).",mv:"HVV-billett kjøpes i appen eller automat; flyplassen er i sone AB"},
      {t:"15:40",n:"Øl til leiligheten – Edeka",a:"Stresemannstraße 161",w:"Stort utvalg, kaldt øl. 3 min gange fra Holstenstraße, 5 min fra leiligheten. Åpent til 21. Stengt søndag. Betaling: kort.",mv:"På vei fra S-Bahn"},
      {t:"15:50",n:"Innsjekk leiligheten",a:"Nagels Allee 8",w:"Kast bagasjen, første øl, skift til middag.",mv:""},
      {t:"16:30",n:"Wegbier til Bullerei",a:"Nagels Allee → Stresemannstraße → Schanzenstraße",w:"Gå med en øl i hånda – lovlig og helt vanlig i Hamburg. 20–25 min. Ta med flaskeåpner (kork, ikke skru). Backup hvis dere er sent ute: S21/S31 ett stopp Holstenstraße → Sternschanze, 10 min.",mv:"Til fots"},
      {t:"17:00",n:"Bullerei",a:"Lagerstraße 34b, Schanze",w:"Bord booket i restaurantdelen. Overraskelsesmenyen på 3–4 retter er signaturen. Betaling: kort.",mv:"Rett overfor S/U Sternschanze"},
      {t:"19:30",n:"Altes Mädchen",a:"Lagerstraße 28b",w:"Ratsherrn-ølhall, lange bord, 60+ øl og smaksbrett. Sitt og prat til oppgjøret kl. 22. Betaling: kort.",mv:"50 m fra Bullerei"},
      {t:"22:30",n:"Casino Esplanade",a:"Stephansplatz 10",w:"Roulette, blackjack, poker. Legitimasjon og pent antrekk (skjorte). Betaling: kontanter til sjetonger.",mv:"Taxi, ca. 10 min"}
  ] },
  fre: { intro:"Fredag 25. – plan fra Andreas.", stops:[
      {t:"12:00",n:"Lunsj – Dum99",a:"Friedensallee 13, Ottensen",w:"Kinesisk – dumplings og nudler. Tar ikke reservasjon – bare gå inn. Hold igjen på øl her – WoodCutter slipper ikke inn påvirkede gjester, uten refusjon.",mv:"Ca. 15 min gange fra Nagels Allee, eller S-Bahn til Altona"},
      {t:"13:45",n:"WoodCutter Hamburg – ankomst",a:"Baurstraße 2, 22605 Hamburg",w:"Ankomst og klargjøring før økta.",mv:"Ca. 10 min taxi fra Ottensen"},
      {t:"14:30",n:"Øksekasting – WoodCutter",a:"Baurstraße 2",w:"Ca. 60 min med instruktør. Konkurranse, økser og høy treffprosent? Dekket av kassa. Stedet er kontantfritt – drikke på kort. Ikke møt opp beruset: da slipper du ikke inn.",mv:""},
      {t:"16:45",n:"Avreise mot minigolfen",a:"",w:"Litt slingringsmonn før neste aktivitet.",mv:"Ca. 20–25 min taxi/bil"},
      {t:"17:30",n:"Minigolf – Schwarzlichtviertel",a:"Kieler Str. 571, 22525 Hamburg",w:"Minigolf i mørket – 18½ hull, ca. 90 min for 6. Dekket av kassa. Bar med drikke: debetkort, kontant i reserve.",mv:""},
      {t:"19:45",n:"Middag – Ashirwad",a:"Bahrenfelder Chaussee 25",w:"Bord booket. Indisk – curry, naan og store porsjoner. Betaling: hver for seg.",mv:"Ca. 10 min taxi fra Schwarzlichtviertel"},
      {t:"21:30",n:"Karaoke – Thai Oase",a:"Große Freiheit 40",w:"Hamburgs karaoke-institusjon: åpen scene, tusenvis av låter, stappfullt og vennlig. Kom tidlig og meld inn låter med en gang – køen blir lang. Betaling: kontant. Alternativ med bedre lyd og billigere øl: Tawan Daeng, Hopfenstraße 34 (åpner 21).",mv:"Taxi fra Ashirwad, ca. 10 min"},
      {t:"23:30",n:"Resten av kvelden – åpent",a:"",w:"Fellesskapet bestemmer. Dere står på Große Freiheit: Kaiserkeller og Große Freiheit 36 (konsert/club) rett ved, Hamburger Berg 200 m unna, Elbschlosskeller døgnåpen.",mv:""}
  ] },
  lor: {
    intro:"Lørdag 26. – øl, kicker, middag og bule. Ca. 500 m gange totalt. Ta med kontanter.",
    stops:[
      {t:"10:30",n:"Brunsj – Otto's Lokstedt",a:"Rütersbarg 2, 22529 Hamburg",w:"Bord booket. Stullen, egg, pancakes, granola. Betaling: hver for seg, kort bør gå – ha litt kontant i tilfelle.",mv:"Taxi/Uber XL fra Nagels Allee, ca. 20 min"},
      {t:"12:00",n:"Football Fun Package XXL",a:"Eintracht Lokstedt, Döhrntwiete 2, 22529 Hamburg",w:"12–14. Dekket av kassa, drikke inkludert. Ca. 25 min bil hjem etterpå.",mv:"3 min gange fra Otto's"},
      {t:"14:30",n:"Leiligheten",a:"Nagels Allee 8, 22769 Hamburg",w:"Dusj og omkledning.",mv:""},
      {t:"15:30",n:"Astra St. Pauli Brauerei",a:"Nobistor 16",w:"Enkel mat + hele Astra-utvalget på fat. Sitt ute på gårdsplassen. Betaling: kort.",mv:"Taxi, ca. 10 min"},
      {t:"16:45",n:"Holsten-Schwemme",a:"Herrenweide 2a",w:"Sjømannskneipe, biljard og dart. Betaling: KONTANT.",mv:"200 m"},

// Felles lagring: et Google-regneark bak et Apps Script-webapp (se oppsett). Personlig lagring: localStorage.
const API = "https://script.google.com/macros/s/AKfycbxzL5oUHbBL2Rdai1OQNNhz1REw9TLKCCTipLDXY9PBZZE3WYHvMXLmkFnDXTRsWjmS/exec";                          // <-- lim inn Apps Script-URL-en her (slutter på /exec)
let cache = {};                          // siste kjente felles verdier, key -> JSON-streng
let online = true;
async function syncAll(){
  if (!API) return false;
  try{
    const r = await fetch(API + '?t=' + Date.now(), {cache:'no-store'});
    const j = await r.json();
    if (j && j.items){ cache = j.items; online = true; return true; }
  }catch(e){ console.error("sync", e); }
  online = false; return false;
}
async function sget(key, shared){
  if (!shared){ try{ const v = localStorage.getItem(key); return v === null ? null : JSON.parse(v); }catch(e){ return null; } }
  if (!(key in cache)) return null;
  try{ return JSON.parse(cache[key]); }catch(e){ return null; }
}
async function sset(key, val, shared){
  if (!shared){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }
  if (typeof me !== 'undefined' && SPECTATORS.includes(me)) return false; // tilskuere skriver aldri til felles lagring
  if (!API) return false;
  try{
    const r = await fetch(API, {method:'POST', body: JSON.stringify({key, value: val})}); // text/plain → ingen preflight
    const j = await r.json();
    if (!j || !j.ok) return false;
    cache[key] = JSON.stringify(val); online = true; return true;
  }catch(e){ console.error("save", e); online = false; return false; }
}

const dayState = {};
async function loadDay(d){
  const extra = await sget(KEY_DAY(d), true) || [];
  dayState[d] = extra;
  renderDay(d);
}
function renderDay(d){
  const pane = document.getElementById('pane-'+d);
  const fixed = FIXED_DAYS[d];
  const stops = [...fixed.stops, ...dayState[d].map(s => ({...s, custom:true}))]
    .sort((a,b)=>sortKey(a.t)-sortKey(b.t));
  let html = `<p class="day-intro">${fixed.intro}</p>`;
  if (!stops.length){
    html += `<div class="empty"><strong>Ingenting her ennå</strong>Legg til stopp når planen er klar.</div>`;
  } else {
    html += stops.map((s,i)=>`
      <div class="stop">
        <div class="t">${esc(s.t)}</div>
        <div>
          <div class="n">${esc(s.n)}</div>
          ${s.a?`<div class="a">${esc(s.a)}</div>`:''}
          ${s.w?`<div class="w">${esc(s.w)}</div>`:''}
          ${s.mv?`<span class="mv">${esc(s.mv)}</span>`:''}
          ${s.custom && !isSpec() && isOrganizer()?`<div><button class="del" data-day="${d}" data-id="${s.id}">Fjern</button></div>`:''}
        </div>
      </div>`).join('');
  }
  if (isSpec() || !isOrganizer()){ pane.innerHTML = html; return; }   // bare arrangørene kan legge til/fjerne stopp
  html += `
    <details class="add">
      <summary>+ Legg til stopp</summary>
      <div class="form">
        <div class="row"><input placeholder="Kl." data-f="t" maxlength="5"><input placeholder="Sted" data-f="n"></div>
        <input placeholder="Adresse (valgfritt)" data-f="a">
        <textarea placeholder="Hva skjer her?" data-f="w" rows="2"></textarea>
        <input placeholder="Transport dit (valgfritt)" data-f="mv">
        <button class="btn" data-add="${d}">Lagre stopp</button>
      </div>
    </details>
    <p class="status">Stopp du legger til her ser alle. Bare Enzo og Andreas kan endre programmet.</p>`;
  pane.innerHTML = html;

  pane.querySelector('[data-add]').addEventListener('click', async e=>{
    const f = {}; pane.querySelectorAll('[data-f]').forEach(el => f[el.dataset.f] = el.value.trim());
    if(!f.n){ alert("Skriv inn et sted."); return; }
    f.id = Date.now().toString(36);
    dayState[d].push(f);
    await sset(KEY_DAY(d), dayState[d], true);
    renderDay(d);
  });
  pane.querySelectorAll('.del').forEach(b => b.addEventListener('click', async ()=>{
    dayState[d] = dayState[d].filter(s => s.id !== b.dataset.id);
    await sset(KEY_DAY(d), dayState[d], true);
    renderDay(d);
  }));
}
function sortKey(t){ // 05:00 counts as after midnight
  const m = /^(\d{1,2}):?(\d{2})?/.exec(t||""); if(!m) return 9999;
  let h = +m[1], mi = +(m[2]||0); if (h < 10) h += 24; return h*60+mi;
}
function esc(s){ return String(s||"").replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    gateEl.hidden = false;
    gateEl.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', async ()=>{
      const i = +b.dataset.g;
      done[me]['g00'] = (i === m.a) ? true : {wrong:i};
      const ok = await sset(KEY_DONE(me), done[me], true);
      if(!ok){ alert("Fikk ikke lagret – prøv igjen."); delete done[me]['g00']; return; }
      maybeGate();                                   // videre til låst skjerm – ingen fasit
    }));
    return;
  }
  needsUnlock().then(locked => {
    if (!locked){ gateEl.hidden = true; return; }
    gateEl.innerHTML = `<h2>Svar registrert.</h2><p>Appen er låst til destinasjonen avsløres. Skriv inn koden du får av Enzo eller Andreas.</p>
      <div class="pin"><input type="text" inputmode="numeric" maxlength="8" placeholder="Kode" id="pin-in" autocomplete="off"><button class="btn" id="pin-ok">Lås opp</button></div>
      <p id="pin-msg" class="pinmsg"></p>`;
    gateEl.hidden = false;

      const v = document.getElementById('pin-in').value.trim();
      if (v === UNLOCK_PIN){ await sset(KEY_UNLOCK, true, false); gateEl.hidden = true; renderOpp(); Object.keys(dayState).forEach(renderDay); }
      else document.getElementById('pin-msg').textContent = 'Feil kode.';
    };
    document.getElementById('pin-ok').addEventListener('click', tryPin);
    document.getElementById('pin-in').addEventListener('keydown', e => { if (e.key === 'Enter') tryPin(); });
  });
}
async function needsUnlock(){
  if (!me || isSpec() || QUIZ_MAKERS.includes(me)) return false;
  if (round !== 1) return false;
  return !(await sget(KEY_UNLOCK, false));
}
async function loadOpp(){
  await syncAll();
  round = (await sget(KEY_ROUND, true)) || 1;
  results = (await sget(KEY_RESULTS, true)) || [];
  teams = await sget(KEY_TEAMS(), true);
  ff = await sget(KEY_FF(), true) || [];
  await loadDone();
  renderOpp();
}
async function loadDone(){
  await syncAll();
  const results = await Promise.all(PEOPLE.map(p => sget(KEY_DONE(p), true)));
  PEOPLE.forEach((p,i) => done[p] = results[i] || {});
}
function teamOf(p){ if(!teams) return null; return teams.A.includes(p) ? 'A' : (teams.B.includes(p) ? 'B' : null); }
const FF_PENALTY = 5;
const FF_VOTERS_NEEDED = 3;                    // flertall blant de fem som kan stemme
function ffStatus(e){                          // 'ok' | 'pending' | 'dismissed'
  if (!e.d) return 'ok';
  const v = Object.values(e.v || {});
  const g = v.filter(x => x === 'g').length, f = v.filter(x => x === 'f').length;
  if (g >= FF_VOTERS_NEEDED) return 'ok';
  if (f >= FF_VOTERS_NEEDED) return 'dismissed';
  if (g + f >= PEOPLE.length - 1) return g > f ? 'ok' : 'dismissed';   // alle har stemt – flertall, uavgjort frikjenner
  return 'pending';
}
function ffCount(p){ return ff.filter(e => e.who === p && ffStatus(e) === 'ok').length; }
function ffPenalty(team){ return teams[team].reduce((a,p) => a + ffCount(p)*FF_PENALTY, 0); }
function points(team){
  let s = 0;
  for (const m of activeMissions()){
    if (m.once){ if (teams[team].some(p => done[p] && done[p][m.id] === true)) s += m.p; continue; }
    for (const p of teams[team]) if (done[p] && done[p][m.id] === true) s += m.p;
  }
  return s - ffPenalty(team);
}
function personPts(p){
  let s = 0;
  for (const m of activeMissions()) if (done[p] && done[p][m.id] === true) s += m.p;
  return s - ffCount(p)*FF_PENALTY;
}

}
async function undoDay(){
  if (!isOrganizer() || !results.length) return;
  await syncAll();
  const last = results[results.length - 1];
  if (!confirm(`Angre oppgjøret for ${last.name}? Poengene fra ${last.name} åpnes igjen, og alt som er krysset av etterpå (${round <= 3 ? ROUNDS[round] : 'etter siste dag'}) slettes.`)) return;
  // slett data for runden som ble startet ved oppgjøret
  if (round <= 3){
    await sset(KEY_TEAMS(round), null, true);
    await sset(KEY_FF(round), [], true);
    await Promise.all(PEOPLE.map(p => sset(KEY_DONE(p, round), {}, true)));
  }
  const res = results.slice(0, -1);
  await sset(KEY_RESULTS, res, true);
  await sset(KEY_ROUND, last.round, true);
  const seen = (await sget(KEY_SEEN, false)) || 0; await sset(KEY_SEEN, Math.min(seen, res.length), false);
  await loadOpp(); maybeGate();
}
async function resetAll(){
  if(!confirm("Nullstille alt? Alle tre dager, lag, avkryssinger, resultater og Fahnenflucht slettes. Dette kan ikke angres.")) return;
  for (const r of [1,2,3]){
    await sset(KEY_TEAMS(r), null, true);
    await sset(KEY_FF(r), [], true);
    await Promise.all(PEOPLE.map(p => sset(KEY_DONE(p, r), {}, true)));
  }
  await sset(KEY_RESULTS, [], true);
  await sset(KEY_ROUND, 1, true);
  await sset(KEY_SEEN, 0, false);
  await sset(KEY_UNLOCK, false, false);
  await loadOpp(); maybeGate();
}
async function refreshScores(){
  const st = document.getElementById('st'); if (st) st.textContent = "Henter …";
  await syncAll();
  const r = (await sget(KEY_ROUND, true)) || 1;
  if (r !== round){ await loadOpp(); maybeGate(); maybeAnnounce(); return; }   // noen har avsluttet dagen – last alt på nytt
  results = (await sget(KEY_RESULTS, true)) || results;
  teams = await sget(KEY_TEAMS(), true) || teams;
  ff = await sget(KEY_FF(), true) || ff;
  await loadDone();
  renderOpp();
  const st2 = document.getElementById('st'); if (st2) st2.textContent = online ? "Oppdatert " + new Date().toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'}) : "Får ikke kontakt med lagringen – sjekk nett.";
}
setInterval(async ()=>{
  if (document.getElementById('pane-opp').classList.contains('active')) { refreshScores(); return; }
  await syncAll();
  const r = (await sget(KEY_ROUND, true)) || 1;                 // sjekk i bakgrunnen
  if (r !== round){ await loadOpp(); maybeGate(); maybeAnnounce(); }
}, 20000);

/* ---------- Init ---------- */
(async ()=>{
  if (!API){
    document.getElementById('gate').hidden = false;
    document.getElementById('gate').innerHTML = `<h2>Ikke koblet til</h2><p>Appen mangler adressen til regnearket. Lim inn Apps Script-URL-en i <code>API</code> øverst i koden og last opp på nytt.</p>`;
    return;
  }
  me = await sget(KEY_ME, false);
  await Promise.all(['tor','fre','lor','son'].map(loadDay));
  await loadOpp();
  maybeGate();
  maybeAnnounce();
})();
</script>
